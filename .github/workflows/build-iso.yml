# Builds the Pero OS ISO in a Debian 13 container and keeps it as a workflow
# artifact (Actions → this run → Artifacts → pero-os-iso).
name: Build ISO

on:
  push:
    branches: [main, "fix/**"]
    paths-ignore: ["README.md", "test/**", ".github/workflows/release.yml"]
  workflow_dispatch:

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # live-build needs ~15 GB; the runner image ships ~30 GB of toolchains we don't use
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker image prune -af >/dev/null
          df -h / /mnt

      - name: Build in Debian 13
        run: |
          sudo mkdir -p /mnt/pero-build
          sudo docker run --rm --privileged \
            -v "$PWD":/src -v /mnt/pero-build:/work \
            -e PERO_SRC=/src -e PERO_WORK=/work \
            debian:trixie bash /src/build.sh
          sudo chown -R "$(id -u)" out
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: pero-os-iso
          path: out/
          compression-level: 0
          retention-days: 30
