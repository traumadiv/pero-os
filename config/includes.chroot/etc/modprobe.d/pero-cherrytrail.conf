# Pero OS: Intel Atom x5 (Cherry Trail) tablet defaults.

# Realtek RTL8723BS SDIO Wi-Fi (typical for these tablets): power saving makes
# the link drop and the throughput crawl.
options r8723bs rtw_power_mgnt=0 rtw_enusbss=0

# i915: framebuffer compression saves power on Gen8; PSR panels flicker on some boards.
options i915 enable_fbc=1 enable_psr=0
