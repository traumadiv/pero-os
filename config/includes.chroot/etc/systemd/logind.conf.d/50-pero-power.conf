# Pero OS: the tablet's physical power button puts it to sleep, everywhere
# (also on the login screen). A long press still powers off.
[Login]
HandlePowerKey=suspend
HandlePowerKeyLongPress=poweroff
PowerKeyIgnoreInhibited=yes
# A tablet has no lid. Its hall sensor (meant for the keyboard dock's magnet)
# reports "lid closed" when the tablet is turned over, which put it to sleep.
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
