# Pero OS power keys. The iWork 10 Pro never comes back from suspend (s2idle):
# it ends up switched off and boots anew. So nothing here suspends, and the
# sleep targets are masked (see the image hook / pero-update) so nothing else
# can either.
[Login]
# Short press: lock (light-locker), the screen goes dark on its own timeout;
# the "Экран" tile in quick settings switches it off at once.
HandlePowerKey=lock
PowerKeyIgnoreInhibited=yes
# The AXP288 PMIC reports a "long press" by itself (seen in the journal with no
# hand on the button); holding the button ~10 s still powers off in hardware.
HandlePowerKeyLongPress=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
# A tablet has no lid. Its hall sensor (for the keyboard dock's magnet) reports
# "lid closed" when the tablet is turned over.
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
IdleAction=ignore
