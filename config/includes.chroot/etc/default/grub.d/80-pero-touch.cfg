# Silead MSSL1680 touch panel of the Alldocube iWork 10 Pro: 1920x1200, both
# axes reported mirrored (checked on the tablet),
# 10 fingers (from the HID descriptor of its Windows driver). The kernel has no
# DMI quirk for this tablet, so the geometry comes from the command line.
# pero-touch-setup --size rewrites this file.
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT i2c_touchscreen_props=MSSL1680:touchscreen-size-x=1920:touchscreen-size-y=1200:silead,max-fingers=10:touchscreen-inverted-x:touchscreen-inverted-y"
