# Keyboard-dock touchpad: tap to click, two-finger tap = right click,
# three-finger tap = middle click, two-finger press on the pad = right click.
Section "InputClass"
	Identifier "pero touchpad"
	MatchIsTouchpad "on"
	MatchDriver "libinput"
	Option "Tapping" "on"
	Option "TappingButtonMap" "lrm"
	Option "TappingDrag" "on"
	Option "ClickMethod" "clickfinger"
	Option "DisableWhileTyping" "on"
EndSection
