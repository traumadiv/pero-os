# Pero OS: applied on top of the user's retroarch.cfg on every start
# (pero-games passes it with --appendconfig), so a change here also reaches
# configs RetroArch has already written. Only what keeps it stable on Cherry Trail.

# Threaded video is the usual RetroArch crash on Intel Mesa (and a freeze when
# the menu and a hardware-rendered core switch contexts)
video_threaded = "false"
video_shared_context = "false"
video_driver = "gl"
video_vsync = "true"
video_max_swapchain_images = "2"
# PipeWire through its PulseAudio side; ALSA straight to the device fights it
audio_driver = "pulse"
audio_latency = "96"
microphone_enable = "false"
# Each of these costs a stall or a crash on a 1.44 GHz Atom with 4 GB
rewind_enable = "false"
run_ahead_enabled = "false"
menu_show_core_updater = "false"
menu_timedate_enable = "false"
network_buildbot_auto_extract_archive = "false"
# A crash leaves ~/.cache/retroarch/retroarch.log (pero-hwinfo picks it up)
log_verbosity = "true"
log_to_file = "true"
log_to_file_timestamp = "false"
log_dir = "~/.cache/retroarch"
frontend_log_level = "1"
