# Pero OS: mpv on a Cherry Trail tablet (1920x1200, HD Graphics 400).
# Shipped in place, so pero-update brings changes. Your own settings go to
# ~/.config/mpv/mpv.conf and win over these.

# Light scaling: the GPU's time goes to the frames, not to filters.
# The full-quality scalers dropped frames on 1080p
profile=fast

# Decode on the GPU (VA-API, i965): H.264, MPEG-2, VC-1, VP8
hwdec=auto-safe
vo=gpu,xv,x11
# H.265 and VP9 are decoded by the processor: all four cores, and the
# deblocking of frames nothing refers to is skipped (unnoticeable on a
# 10" screen). Ignored when the GPU decodes
vd-lavc-threads=4
vd-lavc-skiploopfilter=nonref
# Late frames are dropped, not piled up: sound and picture stay together
framedrop=vo

fullscreen=yes
keep-open=yes
save-position-on-quit=yes
cache=yes
demuxer-max-bytes=150MiB
demuxer-readahead-secs=30
slang=ru,rus,en,eng
alang=ru,rus,en,eng
script-opts=osc-scalewindowed=2,osc-scalefullscreen=2,osc-deadzonesize=0.3
